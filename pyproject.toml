[project]
name = "incidentforge"
version = "0.1.0"
description = "AI incident response evaluation lab"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "aiosqlite>=0.20",
    "kubernetes>=31.0",
    "boto3>=1.35",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "python-ulid>=3.0",
    "sse-starlette>=2.1",
    "openai>=1.50",
    "anthropic>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.11",
    "httpx>=0.27",
    "anyio>=4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
