name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit + contract tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint
        run: uv run ruff check contracts/ services/ tests/

      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/services/api

  frontend-build:
    name: Next.js build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: cd apps/web && npm ci

      - name: Type check
        run: cd apps/web && npx tsc --noEmit

      - name: Build
        run: cd apps/web && npm run build

  # Integration tests require kind — only run on explicit trigger for now.
  # integration-tests:
  #   name: Integration tests (kind)
  #   runs-on: ubuntu-latest
  #   if: github.event_name == 'workflow_dispatch'
